[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion-arc"
version = "0.1.0"
description = "Flow-only FLUX.2 solver experiments for ARC-AGI-2"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "accelerate==1.12.0",
  "diffusers==0.39.0",
  "einops==0.8.1",
  "nvidia-ml-py==13.610.43",
  "Pillow==11.3.0",
  "psutil==7.2.2",
  "safetensors==0.8.0",
  "torch==2.13.0",
  "transformers==4.56.1",
  "wandb==0.30.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
