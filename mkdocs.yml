site_name: Diffusion-ARC
site_description: Architecture, performance results, and Python API reference.
repo_url: https://github.com/joshuakauling/diffusion-arc
docs_dir: docs
site_dir: _site
theme:
  name: material
  font: false
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: blue
      accent: light blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
extra_css:
  - _stylesheets/extra.css
nav:
  - Overview: _README.md
  - Architecture:
      - Initial approach: architecture/initial-flow-only-architecture.md
      - FLUX.2 Klein: architecture/flux2-klein-architecture.md
      - NVARC: architecture/nvarc-overview.md
  - Training:
      - Overview: training/README.md
      - First ARC-AGI-1 epoch: training/arc-agi-1-recipe.md
      - NVARC encoder: training/nvarc-batch-runner.md
      - FLUX sequence packing: training/flux-sequence-packing.md
  - Performance:
      - Benchmark overview: performance/README.md
      - B0 — First training run: performance/b0.md
      - B1 — Fixed buckets: performance/b1.md
      - B2 — Scheduled batches: performance/b2.md
      - B3 — FA3 packing: performance/b3.md
      - B3 NVARC analysis: performance/b3-nvarc.md
      - B3 FLUX analysis: performance/b3-flux.md
      - Two-GPU DDP: performance/ddp.md
      - FSDP2 optimization experiments: performance/fsdp2.md
  - Experiments: experiments/README.md
  - Research ideas: research-ideas.md
  - Code reference: _api.md
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            allow_inspection: false
            members_order: source
            show_source: false
            show_signature_annotations: true
            heading_level: 3
markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true
watch:
  - src/diffusion_arc
