<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="title description">
  <title id="title">ARC task 0d3d703e</title>
  <desc id="description">Four input-output demonstrations and the original query with its expected target. Each grid is three by three and the task applies a fixed color mapping.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <g id="grid-lines" fill="none" stroke="#ffffff" stroke-opacity="0.72" stroke-width="1.5">
      <path d="M30 0V90M60 0V90M0 30H90M0 60H90"/>
      <rect x="0.75" y="0.75" width="88.5" height="88.5" rx="3" stroke="#0f172a" stroke-opacity="0.72"/>
    </g>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1280" height="600" fill="#f8fafc"/>
  <text x="48" y="55" font-family="Inter, system-ui, sans-serif" font-size="30" font-weight="700" fill="#0f172a">ARC task 0d3d703e</text>
  <text x="48" y="84" font-family="Inter, system-ui, sans-serif" font-size="16" fill="#475569">Infer one fixed color mapping from four 3×3 demonstrations</text>

  <rect x="40" y="112" width="770" height="440" rx="18" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="68" y="148" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" fill="#334155">Training demonstrations</text>

  <!-- Demonstration 1 -->
  <g transform="translate(80 180)">
    <rect width="30" height="90" fill="#aa00ff"/><rect x="30" width="30" height="90" fill="#555555"/><rect x="60" width="30" height="90" fill="#ffaa00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">5 · 8 · 6</text>
  </g>
  <line x1="184" y1="225" x2="226" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(240 180)">
    <rect width="30" height="90" fill="#0055ff"/><rect x="30" width="30" height="90" fill="#0000aa"/><rect x="60" width="30" height="90" fill="#55ff00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">1 · 9 · 2</text>
  </g>

  <!-- Demonstration 2 -->
  <g transform="translate(460 180)">
    <rect width="30" height="90" fill="#55ff00"/><rect x="30" width="30" height="90" fill="#ff0055"/><rect x="60" width="30" height="90" fill="#555555"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">2 · 3 · 8</text>
  </g>
  <line x1="564" y1="225" x2="606" y2="225" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(620 180)">
    <rect width="30" height="90" fill="#ffaa00"/><rect x="30" width="30" height="90" fill="#00ffaa"/><rect x="60" width="30" height="90" fill="#0000aa"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">6 · 4 · 9</text>
  </g>

  <!-- Demonstration 3 -->
  <g transform="translate(80 355)">
    <rect width="30" height="90" fill="#0000aa"/><rect x="30" width="30" height="90" fill="#00ffaa"/><rect x="60" width="30" height="90" fill="#55ff00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">9 · 4 · 2</text>
  </g>
  <line x1="184" y1="400" x2="226" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(240 355)">
    <rect width="30" height="90" fill="#555555"/><rect x="30" width="30" height="90" fill="#ff0055"/><rect x="60" width="30" height="90" fill="#ffaa00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">8 · 3 · 6</text>
  </g>

  <!-- Demonstration 4 -->
  <g transform="translate(460 355)">
    <rect width="30" height="90" fill="#ff0055"/><rect x="30" width="30" height="90" fill="#0055ff"/><rect x="60" width="30" height="90" fill="#55ff00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">3 · 1 · 2</text>
  </g>
  <line x1="564" y1="400" x2="606" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <g transform="translate(620 355)">
    <rect width="30" height="90" fill="#00ffaa"/><rect x="30" width="30" height="90" fill="#aa00ff"/><rect x="60" width="30" height="90" fill="#ffaa00"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">4 · 5 · 6</text>
  </g>

  <rect x="838" y="112" width="402" height="440" rx="18" fill="#f0fdf4" stroke="#bbf7d0" filter="url(#shadow)"/>
  <text x="866" y="148" font-family="Inter, system-ui, sans-serif" font-size="17" font-weight="650" fill="#166534">Original query and target</text>
  <text x="910" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#475569">INPUT</text>
  <text x="1130" y="190" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#166534">EXPECTED</text>

  <g transform="translate(865 215)">
    <rect width="30" height="90" fill="#555555"/><rect x="30" width="30" height="90" fill="#0055ff"/><rect x="60" width="30" height="90" fill="#ff0055"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#64748b">8 · 1 · 3</text>
  </g>
  <line x1="970" y1="260" x2="1068" y2="260" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow)"/>
  <g transform="translate(1085 215)">
    <rect x="-8" y="-8" width="106" height="106" rx="9" fill="none" stroke="#22c55e" stroke-width="3"/>
    <rect width="30" height="90" fill="#0000aa"/><rect x="30" width="30" height="90" fill="#aa00ff"/><rect x="60" width="30" height="90" fill="#00ffaa"/><use href="#grid-lines"/>
    <text x="45" y="112" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" fill="#166534">9 · 5 · 4</text>
  </g>

  <rect x="875" y="385" width="328" height="105" rx="12" fill="#ffffff" stroke="#dcfce7"/>
  <text x="1039" y="419" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="650" fill="#166534">Same grid structure, new color combination</text>
  <text x="1039" y="446" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#475569">The output replaces each input color</text>
  <text x="1039" y="468" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#475569">with the mapping shown in the examples.</text>

  <text x="48" y="582" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#64748b">Colors use the experiment's greedy_rgb_maximin_v1 palette; numbers are ARC color IDs.</text>
</svg>
